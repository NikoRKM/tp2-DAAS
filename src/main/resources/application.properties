spring.application.name=tp2

# URL del servicio MySQL y nombre de la DB
spring.datasource.url=jdbc:${DB_SUBPROTOCOL}://${DB_HOST}:${DB_PORT}/${DB_DATABASE_NAME}

# Datos del usuario de la DB
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Registro de sentencias SQL
spring.jpa.show-sql=true

# Crea o Actualiza la DB
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.hibernate.ddl-auto=update

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#server.port=8081

app.comisiones.cuenta-corriente = 5000.00
app.comisiones.caja-ahorro = 2000.00
# Cada cuanto se ejecuta la tarea automatizada
# (segundos (0-59)) (minutos (0-59)) (horas (0-23)) (dias del mes (1-31)) (meses (1-12)) (dias de la semana (1-7))
#app.comisiones.cron = "0 0 0 1 * ?"
app.comisiones.cron = 0 */1 * * * ?